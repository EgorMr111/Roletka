<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Wheel</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6fa;--panel:#fff;--text:#151722;--muted:#707584;--border:#e3e5eb;--accent:#6c5ce7}
@media(prefers-color-scheme:dark){:root{--bg:#11131a;--panel:#1a1d26;--text:#f4f5f8;--muted:#9ca2b2;--border:#303442}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
#app{min-height:100vh;background:var(--bg);padding:28px 18px}.wrap{max-width:1080px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:25px;font-weight:850}.sub{color:var(--muted);font-size:14px;margin-top:3px}.layout{display:grid;grid-template-columns:minmax(330px,1fr) 340px;gap:22px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 10px 35px #0000000b}.wheelbox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:650px}.wheelwrap{position:relative;width:min(560px,90vw);aspect-ratio:1}.wheel{width:100%;height:100%;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.72,.12,1);filter:drop-shadow(0 12px 18px #0002)}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;z-index:3;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:0;border-bottom:34px solid #ff4757;filter:drop-shadow(0 3px 3px #0004)}.spin{margin-top:25px;border:0;border-radius:12px;padding:15px 44px;font-size:17px;font-weight:800;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 8px 20px #6c5ce744}.spin:disabled{opacity:.6;cursor:wait}.result{min-height:29px;margin-top:14px;font-size:20px;font-weight:800;text-align:center}.result span{color:var(--accent)}h2{font-size:18px;margin:0 0 8px}.hint{color:var(--muted);font-size:13px;margin-bottom:12px}.row{display:flex;gap:8px;margin-bottom:10px}textarea{width:100%;height:380px;resize:vertical;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);padding:13px;font:inherit;line-height:1.55}button.small{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:9px;padding:9px 12px;cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;margin:13px 0;font-size:14px}.danger{color:#e74c3c}.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.wheelbox{min-height:auto}.wheelwrap{width:min(520px,92vw)}textarea{height:260px}}
</style>
</head>
<body>
<div id="app"><div class="wrap">
<header class="top"><div><div class="brand">🎡 Lucky Wheel</div><div class="sub">Колесо вибору — додай варіанти та крути</div></div></header>
<div class="layout">
<section class="card wheelbox">
<div class="wheelwrap"><div class="pointer"></div><div class="wheel" id="wheel"><canvas id="canvas" width="700" height="700"></canvas></div></div>
<button class="spin" id="spin">КРУТИТИ</button><div class="result" id="result">Переможець: <span>—</span></div>
</section>
<aside class="card"><h2>Варіанти</h2><div class="hint">Кожен рядок — окремий сектор.</div><textarea id="items">Pizza
Burger
Sushi
Kebab
Pasta
Tacos
Salad
Dessert</textarea>
<div class="controls"><button class="small" id="add">+ Додати</button><button class="small" id="shuffle">Перемішати</button><button class="small" id="clear">Очистити</button></div>
<label class="check"><input type="checkbox" id="forced"> <b>Режим “Мій результат”</b></label>
<div id="forcedBox" style="display:none"><div class="hint">Вибери, що має випасти.</div><select id="target" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text)"></select></div>
<div class="note">У звичайному режимі результат випадковий. У режимі “Мій результат” колесо все одно анімується, але зупиняється на вибраному секторі.</div>
</aside>
</div></div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),itemsEl=document.getElementById('items'),wheel=document.getElementById('wheel'),spin=document.getElementById('spin'),result=document.getElementById('result'),forced=document.getElementById('forced'),target=document.getElementById('target');
let rotation=0,spinning=false;
function items(){return itemsEl.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean)}
function colors(i,n){let h=(i*360/n+8)%360;return `hsl(${h},72%,58%)`}
function draw(){let a=items(),n=a.length||1,c=canvas.width/2,r=320;ctx.clearRect(0,0,700,700);ctx.save();ctx.translate(c,c);ctx.rotate(-Math.PI/2);for(let i=0;i<n;i++){let s=2*Math.PI/n;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,i*s,(i+1)*s);ctx.closePath();ctx.fillStyle=colors(i,n);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.stroke();let mid=(i+.5)*s;ctx.save();ctx.rotate(mid);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font=`800 ${Math.max(13,Math.min(24,270/n+9))}px system-ui`;let text=a[i].length>22?a[i].slice(0,21)+'…':a[i];ctx.fillText(text,r-18,7);ctx.restore()}ctx.restore();ctx.beginPath();ctx.arc(c,c,56,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#ddd';ctx.stroke();ctx.fillStyle='#222';ctx.font='800 23px system-ui';ctx.textAlign='center';ctx.fillText('★',c,c+8);updateTargets(a)}
function updateTargets(a){let old=target.value;target.innerHTML='';a.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=x;target.appendChild(o)});if(a.length&&old<a.length)target.value=old}
function chooseIndex(a){if(forced.checked)return Math.max(0,Math.min(a.length-1,+target.value||0));return Math.floor(Math.random()*a.length)}
spin.onclick=()=>{let a=items();if(spinning||!a.length){if(!a.length)result.innerHTML='Додай хоча б один варіант';return}spinning=true;spin.disabled=true;let idx=chooseIndex(a),n=a.length,sector=360/n;let desired=-(idx*sector+sector/2);let current=((rotation%360)+360)%360;let delta=((desired-current+540)%360)-180;rotation+=360*(6+Math.floor(Math.random()*3))+delta;wheel.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{result.innerHTML=`Переможець: <span>${escapeHtml(a[idx])}</span>`;spinning=false;spin.disabled=false},4250)};
forced.onchange=()=>{document.getElementById('forcedBox').style.display=forced.checked?'block':'none'};
itemsEl.oninput=draw;document.getElementById('add').onclick=()=>{itemsEl.value+=(itemsEl.value?'\n':'')+'Новий варіант';draw()};document.getElementById('clear').onclick=()=>{itemsEl.value='';draw()};document.getElementById('shuffle').onclick=()=>{let a=items();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}itemsEl.value=a.join('\n');draw()};function escapeHtml(s){return s.replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}draw();
</script></body></html>
